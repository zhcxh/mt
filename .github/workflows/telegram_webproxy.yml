name: Sync telegram_webproxy.js from Upstream

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 0:00，即北京时间 8:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download upstream file
        run: |
          curl -fsSL \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            https://raw.githubusercontent.com/ToiCF/CF-Workers-TGProxy/main/telegram_webproxy.js \
            -o telegram_webproxy.js

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes detected."
            exit 0
          fi

          git add telegram_webproxy.js
          git commit -m "chore: sync telegram_webproxy.js from upstream"
          git push
